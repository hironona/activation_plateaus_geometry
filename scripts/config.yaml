  #       "https://farm6.staticflickr.com/5309/5872877852_f0008b85e8_z.jpg" # cat of another type
  #       # https://cocodataset.org/#explore?id=299180
  #     ]
  #   - [
  #       # https://cocodataset.org/#explore?id=151497
  #       "https://farm1.staticflickr.com/6/8378612_34ab6787ae_z.jpg",  # cat
  #       "https://farm4.staticflickr.com/3155/3054220240_700f232193_z.jpg" # cat of a similar type
  #       # https://cocodataset.org/#explore?id=502813
  #     ]
  image_pairs:
