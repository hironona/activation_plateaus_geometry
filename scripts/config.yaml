# Configuration for paper_analyses_v2 project

n_steps: 50

model_names:
  hooked_transformer: "gpt2-large"
  vit: "facebook/dinov2-large"
  resnet: "microsoft/resnet-101"
  toy_resnet: "checkpoints/class_spiral/ResNetMLP/noise-0.075-multi_seed_5_runs"
  # Add more seed checkpoints here

layer_to_interpolate_toy_resnet: -2

plateau_visualization:
  n_points: 500
  radius: 1.0
  source_layer_idx: 'input'
  target_layer_idx: 'last'  # -3 for the final layer of the ResNetMLP
  point: [0.0, 0.0] # Of whose plateau to visualize
  metric: "l2_norm"  # What metric to use to color each point in the source space, Options: ['l2_norm', 'jacobian_determinant_full', 'jacobian_determinant_layerwise_prod']

  


text: 
  shared_context: "The house was"
  token_pairs:
    - ["big", "in"]
    - ["big", "large"]

class_spiral:
  pairs:
    - [
      [0.375, 0.0],
      [-0.375, 0.0]
      # the first in blue, the second in green
      # length = 0.75
    ]
    - [
      [0.375, 0.25],
      [0.375, -0.50] 
      # both blue
    ]
  

image:
  # https://cocodataset.org/#explore?id=114269
  # https://cocodataset.org/#explore?id=434958
  shared_image: https://farm6.staticflickr.com/5216/5423157110_0e78ccd4c7_z.jpg # cat and human
